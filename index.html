// ---------- 硬币本体（车削轮廓：微圆边 + 微凹币面） ----------
function buildCoinProfile() {
  const pts = [];
  const arc = 12;

  // 底面：中心凹盘 → 外圈凸边平台
  pts.push(new THREE.Vector2(0.000, -h + 0.045));
  pts.push(new THREE.Vector2(0.20,  -h + 0.044));
  pts.push(new THREE.Vector2(0.50,  -h + 0.041));
  pts.push(new THREE.Vector2(0.80,  -h + 0.034));
  pts.push(new THREE.Vector2(0.84,  -h + 0.022));
  pts.push(new THREE.Vector2(0.87,  -h));
  pts.push(new THREE.Vector2(faceR, -h));

  // 底外缘倒角（不变）
  const c1 = new THREE.Vector2(faceR, -h + re);
  for (let i=1;i<=arc;i++){ const a=-Math.PI/2 + (Math.PI/2)*(i/arc);
    pts.push(new THREE.Vector2(c1.x + re*Math.cos(a), c1.y + re*Math.sin(a))); }

  // 侧面直线（不变）
  pts.push(new THREE.Vector2(R, h - re));

  // 顶外缘倒角（不变）
  const c2 = new THREE.Vector2(faceR, h - re);
  for (let i=1;i<=arc;i++){ const a=(Math.PI/2)*(i/arc);
    pts.push(new THREE.Vector2(c2.x + re*Math.cos(a), c2.y + re*Math.sin(a))); }

  // 顶面：外圈凸边平台 → 陡降台阶 → 中心凹盘
  pts.push(new THREE.Vector2(faceR, h));
  pts.push(new THREE.Vector2(0.87,  h));
  pts.push(new THREE.Vector2(0.84,  h - 0.022));
  pts.push(new THREE.Vector2(0.80,  h - 0.034));
  pts.push(new THREE.Vector2(0.50,  h - 0.041));
  pts.push(new THREE.Vector2(0.20,  h - 0.044));
  pts.push(new THREE.Vector2(0.000, h - 0.045));

  return pts;
}
const coinBody = new THREE.Mesh(
  new THREE.LatheGeometry(buildCoinProfile(), 140),
  goldMat
);
coinBody.geometry.computeVertexNormals();

// ---------- 浮雕文字带纹理（凸起金字母） ----------
function makeRimTextures(str) {
  const W=2048, Hh=256;
  // 颜色画布（金渐变）
  const cc = document.createElement('canvas'); cc.width=W; cc.height=Hh;
  const cx = cc.getContext('2d'); cx.clearRect(0,0,W,Hh);
  cx.font = 'bold 92px Georgia, "Times New Roman", serif';
  cx.textAlign='left'; cx.textBaseline='middle';
  const grad = cx.createLinearGradient(0,0,0,Hh);
  grad.addColorStop(0,'#fff4d6'); grad.addColorStop(0.5,'#e9c27a'); grad.addColorStop(1,'#a9782e');
  let tw = cx.measureText(str).width;
  let reps = Math.ceil(W/tw)+1;
  for (let r=0;r<reps;r++){
    const x = r*tw;
    cx.fillStyle='rgba(54,26,10,0.55)'; cx.fillText(str, x+3, Hh/2+4);     // 阴影
    cx.lineWidth=5; cx.strokeStyle='rgba(70,34,12,0.5)'; cx.strokeText(str, x, Hh/2);
    cx.fillStyle=grad; cx.fillText(str, x, Hh/2);                          // 金字
    cx.fillStyle='rgba(255,255,255,0.28)'; cx.fillText(str, x, Hh/2-3);     // 高光
  }
  const map = new THREE.CanvasTexture(cc); map.colorSpace = THREE.SRGBColorSpace;
  map.wrapS = THREE.RepeatWrapping; map.anisotropy = 8;

  // alpha/bump 画布（白字黑底）
  const ac = document.createElement('canvas'); ac.width=W; ac.height=Hh;
  const ax = ac.getContext('2d'); ax.fillStyle='#000'; ax.fillRect(0,0,W,Hh);
  ax.fillStyle='#fff'; ax.font=cx.font; ax.textAlign='left'; ax.textBaseline='middle';
  for (let r=0;r<reps;r++){ ax.fillText(str, r*tw, Hh/2); }
  const alpha = new THREE.CanvasTexture(ac);
  alpha.wrapS = THREE.RepeatWrapping; alpha.anisotropy = 8;
  return { map, alpha };
}

// 极坐标 UV 圆环（u=角度, v=内→外），保证环形文字方向正确
function makePolarRing(innerR, outerR, segs=240) {
  const g = new THREE.RingGeometry(innerR, outerR, segs, 1);
  const pos = g.attributes.position, uv = g.attributes.uv;
  const v = new THREE.Vector3();
  for (let i=0;i<pos.count;i++){
    v.fromBufferAttribute(pos,i);
    const ang = Math.atan2(v.y, v.x);
    const u = (ang + Math.PI) / (Math.PI*2);
    const rad = Math.sqrt(v.x*v.x + v.y*v.y);
    const w = (rad - innerR) / (outerR - innerR);
    uv.setXY(i, u, w);
  }
  uv.needsUpdate = true;
  return g;
}

function makeTextRing(faceFront, str) {
  const { map, alpha } = makeRimTextures(str);
  const mat = textGoldMat.clone();
  mat.map = map; mat.alphaMap = alpha; mat.bumpMap = alpha; mat.bumpScale = 0.012;
  mat.transparent = false; mat.alphaTest = 0.5;
  mat.needsUpdate = true;
  const mesh = new THREE.Mesh(makePolarRing(0.735, 0.885, 256), mat);
  // 正面法线 +Y（rot.x=-π/2），背面法线 -Y（rot.x=+π/2）
  mesh.rotation.x = faceFront ? -Math.PI/2 : Math.PI/2;
  mesh.position.y = faceFront ? (h + 0.004) : -(h + 0.004);
  return mesh;
}

// ---------- 猫猫章鱼砹酱正面贴图（SVG → Canvas → CanvasTexture） ----------
function makeCatFaceTexture() {
  return new Promise((resolve) => {
    const blob = new Blob([CAT_OCTOPUS_SVG], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      console.log('[FACE TEX] SVG loaded, size =', img.width, img.height);
      const S = 1024;
      const c = document.createElement('canvas');
      c.width = c.height = S;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, S, S);
      const svgAspect = 360 / 320;
      let dw, dh;
      if (svgAspect >= 1) { dw = S; dh = S / svgAspect; }
      else { dh = S; dw = S * svgAspect; }
      ctx.drawImage(img, (S - dw) / 2, (S - dh) / 2, dw, dh);
      URL.revokeObjectURL(url);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      console.log('[FACE TEX] canvas drawn, tex size =', S, S);
      resolve(tex);
    };
    img.onerror = (e) => {
      console.error('[FACE TEX] SVG load FAILED', e);
      resolve(null);
    };
    img.src = url;
  });
}

// ---------- 正面凹盘几何体（贴合币正面凹盘深度的自定义圆盘） ----------
function buildFaceDisc(maxR = 0.80, rings = 24, segs = 64) {
  // 与币正面凹盘匹配的深度函数：中心 -0.045，r=0.80 处 -0.034
  function depth(r) {
    const t = Math.min(r / 0.80, 1);
    return 0.045 - 0.011 * t * t;
  }
  const positions = [];
  const uvs = [];
  const indices = [];
  // 中心顶点
  positions.push(0, -depth(0), 0);
  uvs.push(0.5, 0.5);
  // 逐环
  for (let i = 1; i <= rings; i++) {
    const t = i / rings;
    const r = t * maxR;
    const d = depth(r);
    for (let j = 0; j < segs; j++) {
      const a = (j / segs) * Math.PI * 2;
      positions.push(Math.cos(a) * r, -d, Math.sin(a) * r);
      // u 沿币面 +X，v 沿币面 -Z（保证从正面看图像正立）
      uvs.push(0.5 + Math.cos(a) * t * 0.5, 0.5 - Math.sin(a) * t * 0.5);
    }
  }
  // 中心扇面
  for (let j = 0; j < segs; j++) {
    indices.push(0, 1 + ((j + 1) % segs), 1 + j);
  }
  // 环与环之间
  for (let i = 0; i < rings - 1; i++) {
    const base = 1 + i * segs;
    const nextBase = 1 + (i + 1) * segs;
    for (let j = 0; j < segs; j++) {
      const jn = (j + 1) % segs;
      indices.push(base + j, nextBase + j, nextBase + jn);
      indices.push(base + j, nextBase + jn, base + jn);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

// ---------- 正面浮雕：章章脸 ----------

// ---------- 背面浮雕：大红虾 + 点点 + ∞ ----------
function buildBackFace() {
  const g = new THREE.Group();
  const Y = -h; // 背面 y

  // 虾身曲线（头朝 -Z 上，尾朝 +Z 下，侧弯）
  const curvePts = [
    [0.06, Y, -0.24],
    [-0.02, Y, -0.16],
    [-0.10, Y, -0.06],
    [-0.125, Y, 0.04],
    [-0.07, Y, 0.13],
    [0.04, Y, 0.18],
    [0.12, Y, 0.16],
  ].map(p=>new THREE.Vector3(...p));
  const curve = new THREE.CatmullRomCurve3(curvePts, false, 'catmullrom', 0.5);
  const radii = [0.105, 0.098, 0.088, 0.074, 0.058, 0.044, 0.030];
  // 沿曲线放球，半径递减（分段珠状虾身）
  const beadGeo = new THREE.SphereGeometry(1, 20, 16);
  const N = 26;
  for (let i=0;i<N;i++){
    const t = i/(N-1);
    const p = curve.getPoint(t);
    const seg = t*(radii.length-1);
    const idx = Math.min(radii.length-2, Math.floor(seg));
    const fr = seg - idx;
    const r = THREE.MathUtils.lerp(radii[idx], radii[idx+1], fr);
    const m = new THREE.Mesh(beadGeo, i<2 ? shrimpDarkMat : shrimpMat);
    m.position.copy(p);
    m.scale.setScalar(r);
    g.add(m);
  }
  // 头部小眼
  const headP = curve.getPoint(0);
  const eGeo = new THREE.SphereGeometry(0.02, 14, 12);
  const e1 = new THREE.Mesh(eGeo, pupilMat); e1.position.set(headP.x-0.035, Y, headP.z-0.045); g.add(e1);
  const e2 = new THREE.Mesh(eGeo, pupilMat); e2.position.set(headP.x+0.005, Y, headP.z-0.05); g.add(e2);
  // 两根触须（细锥）
  const antGeo = new THREE.ConeGeometry(0.014, 0.16, 12);
  const a1 = new THREE.Mesh(antGeo, shrimpDarkMat);
  a1.position.set(headP.x-0.03, Y, headP.z-0.13);
  a1.rotation.x = Math.PI/2; a1.rotation.z = 0.3;
  g.add(a1);
  const a2 = new THREE.Mesh(antGeo, shrimpDarkMat);
  a2.position.set(headP.x+0.03, Y, headP.z-0.12);
  a2.rotation.x = Math.PI/2; a2.rotation.z = -0.35;
  g.add(a2);
  // 尾扇（扁平锥 + 两侧鳍）
  const tailP = curve.getPoint(1);
  const fan = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.085, 18), shrimpMat);
  fan.scale.set(1, 0.32, 1);
  fan.position.set(tailP.x+0.05, Y, tailP.z+0.04);
  fan.rotation.x = Math.PI/2; fan.rotation.z = -0.5;
  g.add(fan);
  const finGeo = new THREE.ConeGeometry(0.035, 0.09, 12);
  const f1 = new THREE.Mesh(finGeo, shrimpDarkMat);
  f1.scale.set(1,0.35,1); f1.position.set(tailP.x+0.10, Y, tailP.z+0.065);
  f1.rotation.x=Math.PI/2; f1.rotation.z=-0.2; g.add(f1);
  const f2 = new THREE.Mesh(finGeo, shrimpDarkMat);
  f2.scale.set(1,0.35,1); f2.position.set(tailP.x+0.02, Y, tailP.z+0.075);
  f2.rotation.x=Math.PI/2; f2.rotation.z=0.7; g.add(f2);

  // 环绕圆弧小点点缀
  const dotGeo = new THREE.SphereGeometry(0.023, 14, 12);
  for (let i=0;i<16;i++){
    const a = (i/16)*Math.PI*2;
    const rr = 0.55 + 0.015*Math.sin(i*1.7);
    const d = new THREE.Mesh(dotGeo, dotMat);
    d.position.set(Math.cos(a)*rr, Y - 0.004, Math.sin(a)*rr);
    g.add(d);
  }

  // 3D 浮雕 ∞ 符号（两个相切金环）
  const tor = new THREE.TorusGeometry(0.05, 0.017, 18, 40);
  const inf1 = new THREE.Mesh(tor, dotMat);
  inf1.rotation.x = Math.PI/2;
  inf1.position.set(-0.06, Y - 0.01, -0.34);
  g.add(inf1);
  const inf2 = new THREE.Mesh(tor, dotMat);
  inf2.rotation.x = Math.PI/2;
  inf2.position.set(0.06, Y - 0.01, -0.34);
  g.add(inf2);

  return g;
}

// ---------- 防伪齿轮吸盘（外圈 8 颗车削吸盘：外圈隆起 + 中心凹坑） ----------
function buildSuctionCups() {
  const g = new THREE.Group();

  // 吸盘剖面（局部坐标 x=径向半径, y=轴向高度，绕 Y 轴车削）
  // 由底心 → 外缘 → 隆起 → 中心凹坑底，形成"中间凹、外圈鼓"的吸盘形
  const pts = [
    new THREE.Vector2(0.000, -0.058),  // 底心（嵌入币身）
    new THREE.Vector2(0.060, -0.058),
    new THREE.Vector2(0.092, -0.045),
    new THREE.Vector2(0.100, -0.015),
    new THREE.Vector2(0.098,  0.015),  // 外缘
    new THREE.Vector2(0.090,  0.040),
    new THREE.Vector2(0.075,  0.052),  // 隆起最高处
    new THREE.Vector2(0.052,  0.042),
    new THREE.Vector2(0.028,  0.024),
    new THREE.Vector2(0.000,  0.018),  // 中心凹坑底
  ];
  const cupGeo = new THREE.LatheGeometry(pts, 40);
  cupGeo.computeVertexNormals();

  const n = 8;
  const inset = R - 0.01;                 // 基准圆往内收 0.01，收敛凸出量
  const up = new THREE.Vector3(0, 1, 0);

  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const dir = new THREE.Vector3(Math.cos(a), 0, Math.sin(a));
    const m = new THREE.Mesh(cupGeo, cupMat);
    m.position.copy(dir).multiplyScalar(inset);
    m.quaternion.setFromUnitVectors(up, dir);   // 吸盘轴对齐到径向
    g.add(m);
  }
  return g;
}

// ---------- 装饰刻线环 ----------
function buildLineRing(front) {
  const tor = new THREE.Mesh(
    new THREE.TorusGeometry(0.715, 0.006, 12, 160),

  );
  tor.rotation.x = front ? -Math.PI/2 : Math.PI/2;
  tor.position.y = front ? (h+0.004) : -(h+0.004);
  return tor;
}
function buildOuterLineRing(front) {
  const tor = new THREE.Mesh(
    new THREE.TorusGeometry(0.905, 0.0045, 10, 180),
    lineMat
  );
  tor.rotation.x = front ? -Math.PI/2 : Math.PI/2;
  tor.position.y = front ? (h+0.004) : -(h+0.004);
  return tor;
}

// ---------- 组装硬币（局部 Y 轴朝上；之后整体绕 X 转 π/2 使轴沿 Z） ----------
const coin = new THREE.Group();
coin.add(coinBody);
coin.add(buildSuctionCups());
// coin.add(buildFrontFace());   // 素币：移除正面章鱼脸（函数定义保留，日后可恢复）
// coin.add(buildBackFace());    // 素币：移除背面大红虾（函数定义保留，日后可恢复）
// coin.add(makeTextRing(true,  ' ★ ZHANGZHANG COIN ★ ZZC ★ ∞ ★ '));  // 素面币：移除正面文字金环
// coin.add(makeTextRing(false, ' ★ ZHANGZHANG COIN ★ ZZC ★ ∞ ★ ')); // 素面币：移除背面文字金环
// coin.add(buildLineRing(true));      // 素面币：移除正面内圈刻线
// coin.add(buildLineRing(false));     // 素面币：移除背面内圈刻线
// coin.add(buildOuterLineRing(true)); // 素面币：移除正面外圈刻线
// coin.add(buildOuterLineRing(false));// 素面币：移除背面外圈刻线

    // 异步加载猫猫章鱼砹酱正面贴图，贴在币正面凹盘
    makeCatFaceTexture().then(tex => {
      if (!tex) { console.warn('[FACE] 贴图未生成，跳过'); return; }
      const faceGeo = buildFaceDisc(0.80, 24, 64);
      const faceMat = new THREE.MeshStandardMaterial({
        map: tex,
        transparent: true,
        roughness: 0.58,
        metalness: 0.04,
        envMapIntensity: 0.6,
        side: THREE.DoubleSide,
        alphaTest: 0.05,
      });
      const faceMesh = new THREE.Mesh(faceGeo, faceMat);
      faceMesh.position.set(0, h + 0.004, 0);   // 上抬 0.004，贴图盘浮出凹盘
      coin.add(faceMesh);
    });

coin.rotation.x = Math.PI/2;   // 正面(+Y) -> 朝相机(+Z)，背面(-Y) -> -Z

// ---------- 层级组：悬浮 / 悬停倾斜+Q弹 / 自转 / 朝向 ----------
const floatGroup = new THREE.Group(); scene.add(floatGroup);
const tiltGroup  = new THREE.Group(); floatGroup.add(tiltGroup);
const spinGroup  = new THREE.Group(); tiltGroup.add(spinGroup);
spinGroup.add(coin);

// ---------- OrbitControls ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.rotateSpeed = 0.85;
controls.zoomSpeed = 0.8;
controls.minDistance = 2.4;
controls.maxDistance = 7.0;
controls.minPolarAngle = 0.22;
controls.maxPolarAngle = Math.PI - 0.22;
controls.target.set(0, 0, 0);

// ---------- 后处理 Bloom ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight), 0.32, 0.55, 0.9
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- 交互：悬停倾斜 + 点击 Q 弹 ----------
const tilt = { x:0, z:0, tx:0, tz:0 };     // 目标 / 当前
let bounceT = -1;                            // Q弹计时（-1 未触发）
function triggerBounce(){ bounceT = 0; }

const dom = renderer.domElement;
dom.addEventListener('pointermove', (e)=>{
  if (e.pointerType && e.pointerType !== 'mouse') return;
  const nx = (e.clientX / window.innerWidth) * 2 - 1;
  const ny = (e.clientY / window.innerHeight) * 2 - 1;
  tilt.tx = ny * 0.28;
  tilt.tz = -nx * 0.28;
});
dom.addEventListener('pointerdown', (e)=>{
  if (e.pointerType === 'touch') { tilt.tx = 0; tilt.tz = 0; }
  triggerBounce();
});
// 离开窗口时回正
window.addEventListener('pointerleave', ()=>{ tilt.tx = 0; tilt.tz = 0; });

// ---------- 动画循环 ----------
const clock = new THREE.Clock();
function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // Sine 呼吸悬浮（自转已停用，保留悬浮 + 拖拽 + 点击抖动）
  // spinGroup.rotation.y += dt * 0.5;
  floatGroup.position.y = Math.sin(t * 1.15) * 0.06;

  // 悬停倾斜（平滑跟随指针）
  tilt.x += (tilt.tx - tilt.x) * 0.08;
  tilt.z += (tilt.tz - tilt.z) * 0.08;
  tiltGroup.rotation.x = tilt.x;
  tiltGroup.rotation.z = tilt.z;

  // Q弹果冻抖动：阻尼余弦，纵向压缩 / 横向拉伸
  if (bounceT >= 0) {
    bounceT += dt;
    const s = 0.16 * Math.exp(-3.4 * bounceT) * Math.cos(13 * bounceT);
    tiltGroup.scale.set(1 + s, 1 - s * 1.25, 1 + s);
    if (bounceT > 1.6) { bounceT = -1; tiltGroup.scale.set(1,1,1); }
  }

  controls.update();
  composer.render();
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// ---------- 自适应 ----------
function onResize() {
  const w = window.innerWidth, hgt = window.innerHeight;
  camera.aspect = w / hgt;
  camera.updateProjectionMatrix();
  renderer.setSize(w, hgt);
  composer.setSize(w, hgt);
  bloom.setSize(w, hgt);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);
